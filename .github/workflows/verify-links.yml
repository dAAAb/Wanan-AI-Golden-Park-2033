name: verify-links
on:
  workflow_dispatch:
  push:
    paths: ['tools/verify/**', '.github/workflows/verify-links.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: HTTP checks
        run: |
          sleep 30
          while read -r u; do
            [ -z "$u" ] && continue
            out=$(curl -s -L -o /tmp/body -w '%{http_code} %{content_type} %{size_download}' -m 60 "$u")
            echo "RESULT $out $u"
          done < tools/verify/urls.txt
      - name: Browser check of the public site
        run: |
          mkdir -p research/verify
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node tools/verify/e2e.mjs https://ai2033.taipei | tee research/verify/e2e.txt
      - if: always()
        run: 'bash tools/fetch/commit.sh "chore(verify): end-to-end screenshots of the public site" research/verify'
